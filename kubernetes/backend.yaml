# Values surrounded by __...__ are resolved automatically by CI/CD
# before this manifest is applied to Kubernetes.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: default

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: default

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      serviceAccountName: backend

      containers:
        - name: backend
          image: "__BACKEND_IMAGE__"

          ports:
            - containerPort: 3000

          env:
            - name: AWS_REGION
              value: "eu-south-2"

            - name: DB_HOST
              value: "__DB_HOST__"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              value: "challenge_db"

            - name: DB_SSL
              value: "true"

            - name: DB_SECRET_ARN
              value: "__DB_SECRET_ARN__"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: default

spec:
  selector:
    app: backend

  ports:
    - port: 3000
      targetPort: 3000

  type: ClusterIP