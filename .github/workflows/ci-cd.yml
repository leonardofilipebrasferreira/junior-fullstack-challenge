name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: eu-south-2
  AWS_ROLE_ARN: arn:aws:iam::214516808468:role/junior-fullstack-github-actions-role
  EKS_CLUSTER_NAME: junior-fullstack-eks
  BACKEND_ECR_REPOSITORY: junior-fullstack-backend
  FRONTEND_ECR_REPOSITORY: junior-fullstack-frontend
  DB_INSTANCE_IDENTIFIER: junior-fullstack-postgres

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest" \
            ./backend

          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest" \
            ./frontend

          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:latest"

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Resolve AWS deployment values
        id: deployment-values
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          DB_HOST="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)"

          DB_SECRET_ARN="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].MasterUserSecret.SecretArn" \
            --output text)"

          echo "ecr_registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "db_secret_arn=$DB_SECRET_ARN" >> "$GITHUB_OUTPUT"

      - name: Render Kubernetes manifests
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.deployment-values.outputs.ecr_registry }}
          DB_HOST: ${{ steps.deployment-values.outputs.db_host }}
          DB_SECRET_ARN: ${{ steps.deployment-values.outputs.db_secret_arn }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          BACKEND_IMAGE="$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"
          FRONTEND_IMAGE="$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"

          sed \
            -e "s|__BACKEND_IMAGE__|$BACKEND_IMAGE|g" \
            -e "s|__DB_HOST__|$DB_HOST|g" \
            -e "s|__DB_SECRET_ARN__|$DB_SECRET_ARN|g" \
            kubernetes/backend.yaml > /tmp/backend.yaml

          sed \
            -e "s|__FRONTEND_IMAGE__|$FRONTEND_IMAGE|g" \
            kubernetes/frontend.yaml > /tmp/frontend.yaml

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=server \
            -f /tmp/backend.yaml \
            -f /tmp/frontend.yaml
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Resolve AWS deployment values
        id: deployment-values
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID="$(aws sts get-caller-identity \
            --query Account \
            --output text)"

          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          DB_HOST="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].Endpoint.Address" \
            --output text)"

          DB_SECRET_ARN="$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_INSTANCE_IDENTIFIER" \
            --region "$AWS_REGION" \
            --query "DBInstances[0].MasterUserSecret.SecretArn" \
            --output text)"

          echo "ecr_registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "db_host=$DB_HOST" >> "$GITHUB_OUTPUT"
          echo "db_secret_arn=$DB_SECRET_ARN" >> "$GITHUB_OUTPUT"

      - name: Render Kubernetes manifests
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.deployment-values.outputs.ecr_registry }}
          DB_HOST: ${{ steps.deployment-values.outputs.db_host }}
          DB_SECRET_ARN: ${{ steps.deployment-values.outputs.db_secret_arn }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          BACKEND_IMAGE="$ECR_REGISTRY/$BACKEND_ECR_REPOSITORY:$IMAGE_TAG"
          FRONTEND_IMAGE="$ECR_REGISTRY/$FRONTEND_ECR_REPOSITORY:$IMAGE_TAG"

          sed \
            -e "s|__BACKEND_IMAGE__|$BACKEND_IMAGE|g" \
            -e "s|__DB_HOST__|$DB_HOST|g" \
            -e "s|__DB_SECRET_ARN__|$DB_SECRET_ARN|g" \
            kubernetes/backend.yaml > /tmp/backend.yaml

          sed \
            -e "s|__FRONTEND_IMAGE__|$FRONTEND_IMAGE|g" \
            kubernetes/frontend.yaml > /tmp/frontend.yaml

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=server \
            -f /tmp/backend.yaml \
            -f /tmp/frontend.yaml

      - name: Deploy backend
        run: |
          kubectl apply -f /tmp/backend.yaml
          kubectl rollout status deployment/backend --timeout=180s

      - name: Deploy frontend
        run: |
          kubectl apply -f /tmp/frontend.yaml
          kubectl rollout status deployment/frontend --timeout=180s
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f /tmp/backend.yaml
          kubectl apply -f /tmp/frontend.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s