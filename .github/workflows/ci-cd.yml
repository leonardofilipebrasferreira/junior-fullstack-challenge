name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::214516808468:role/junior-fullstack-github-actions-role
          aws-region: eu-south-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/junior-fullstack-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/junior-fullstack-backend:latest \
            ./backend

          docker push $ECR_REGISTRY/junior-fullstack-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/junior-fullstack-backend:latest

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/junior-fullstack-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/junior-fullstack-frontend:latest \
            ./frontend

          docker push $ECR_REGISTRY/junior-fullstack-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/junior-fullstack-frontend:latest

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::214516808468:role/junior-fullstack-github-actions-role
          aws-region: eu-south-2

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region eu-south-2 \
            --name junior-fullstack-eks

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/backend.yaml
          kubectl apply -f kubernetes/frontend.yaml

      - name: Pin deployments to commit images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          kubectl set image \
            deployment/backend \
            backend=214516808468.dkr.ecr.eu-south-2.amazonaws.com/junior-fullstack-backend:$IMAGE_TAG

          kubectl set image \
            deployment/frontend \
            frontend=214516808468.dkr.ecr.eu-south-2.amazonaws.com/junior-fullstack-frontend:$IMAGE_TAG

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s
          kubectl rollout status deployment/frontend --timeout=180s